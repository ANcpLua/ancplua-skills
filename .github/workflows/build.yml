# ═══════════════════════════════════════════════════════════════════════════════
# Build Workflow
# Builds and tests the .NET project using Nuke
# ═══════════════════════════════════════════════════════════════════════════════

name: Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/dependabot.yml'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: ./build.sh Compile --skip

      - name: Generate and verify SKILLS.md
        run: |
          python3 <<'PY'
          from pathlib import Path
          import difflib
          import subprocess

          index = Path("SKILLS.md")
          expected = index.read_text().splitlines()[:-1]
          subprocess.run(["./build.sh", "GenerateSkills"], check=True)
          actual = index.read_text().splitlines()[:-1]
          if actual != expected:
              print("\n".join(difflib.unified_diff(
                  expected, actual, fromfile="checked-in SKILLS.md",
                  tofile="generated SKILLS.md", lineterm=""
              )))
              raise SystemExit("Run './build.sh GenerateSkills' locally and commit.")
          print("SKILLS.md structure is up to date (timestamp ignored)")
          PY

      - name: Validate Skills
        run: ./build.sh ValidateSkills

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ancplua/ancplua-skills:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
